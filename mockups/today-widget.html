<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Пульт дня</title>
<link rel="stylesheet" href="harness.css">
</head>
<body>
<div class="page">
  <div class="phone"><div class="screen">
    <div class="bar">omf<small>бот</small></div>
    <div class="chat">
      <div class="bubble" id="bubble">
        <div id="bubble-body"></div>
        <div class="cap" id="caption"></div>
        <span class="time" id="time">10:00</span>
      </div>
    </div>
  </div></div>
  <div class="side">
    <h1 id="title"></h1>
    <div class="ctl">
      <select id="scn"></select>
      <button id="theme">Тёмная тема</button>
      <button id="push">Бот обновил данные</button>
      <label><input type="checkbox" id="cap" checked> подпись</label>
    </div>
    <div id="warn" hidden></div>
    <ul class="metrics">
      <li data-name="высота"><span>Высота</span><span id="m-h"></span></li>
      <li data-name="состояние"><span>chat_data</span><span id="m-state"></span></li>
      <li data-name="запрос"><span>Последний запрос</span><span id="m-req">—</span></li>
      <li data-name="ответ"><span>Последний ответ</span><span id="m-ans">—</span></li>
      <li data-name="HTML"><span>HTML (мин.)</span><span id="m-html"></span></li>
      <li data-name="zlib"><span>zlib ≈</span><span id="m-zlib"></span></li>
      <li data-name="запрещённое"><span>Запрещённое</span><span id="m-ban"></span></li>
      <li data-name="префикс"><span>Префикс запросов</span><span id="m-pref"></span></li>
    </ul>
    <ul id="log"></ul>
  </div>
</div>

<!-- КОД КАРТОЧКИ: этот же текст бот шлёт в sendWidget (lib/widgets/html/today.html). -->
<template id="widget"><style>
*{box-sizing:border-box}body{margin:0}
#r{padding:10px 10px calc(10px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;text-align:left;cursor:pointer}
.hd{display:flex;align-items:center;gap:9px;padding:2px 4px 10px}
.ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:linear-gradient(140deg,var(--tg-theme-accent-text-color),var(--tg-theme-button-color))}
.ic svg{width:16px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round}
.lb{flex:1;font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.lb,.h,.lv{color:var(--tg-theme-hint-color)}
.lv{font-size:14px}
.lv:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--tg-theme-accent-text-color);margin-right:7px;vertical-align:1px}
.lv.bad:before{background:var(--tg-theme-destructive-text-color)}
.k{display:block;width:100%;background:var(--tg-theme-secondary-bg-color);border-radius:18px;padding:12px 14px}
.u{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.tb{display:flex;padding:2px;border-radius:11px;margin-bottom:12px;background:color-mix(in srgb,var(--tg-theme-hint-color) 15%,transparent)}
.tb button{flex:1;text-align:center;padding:6px 0;border-radius:9px;font-size:14px;font-weight:600;color:var(--tg-theme-hint-color)}
.tb .on{background:var(--tg-theme-bg-color);color:var(--tg-theme-text-color)}
.hr{display:flex;justify-content:space-between;gap:8px}
.big{font-size:40px;line-height:44px;font-weight:800;letter-spacing:-1px}
.big small{font-size:19px;letter-spacing:0;margin-left:7px}
.mid{font-size:26px;line-height:32px;font-weight:800}
.h{font-size:13px}
.pl{flex:none;align-self:flex-start;margin-top:8px;padding:3px 9px;border-radius:9px;font-size:13px;font-weight:700;color:var(--tg-theme-accent-text-color);background:color-mix(in srgb,currentColor 16%,transparent)}
.bad,.pl.bad{color:var(--tg-theme-destructive-text-color)}
.ok{color:var(--tg-theme-accent-text-color)}
.w{display:flex;align-items:center;gap:10px;width:100%;min-height:46px}
.m{flex:1;min-width:0}
.t{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.b{font-weight:600}
.br{flex:none;width:72px;height:6px;border-radius:3px;background:color-mix(in srgb,var(--tg-theme-hint-color) 25%,transparent)}
.br i{display:block;height:100%;border-radius:3px;background:var(--tg-theme-accent-text-color)}
.br .bad{background:var(--tg-theme-destructive-text-color)}
.n{flex:none;width:54px;text-align:right;font-weight:700;white-space:nowrap}
.z{display:flex;gap:6px;padding-bottom:8px}
.z button{flex:1;padding:8px 4px;border-radius:10px;text-align:center;font-size:13px;font-weight:600;background:var(--tg-theme-bg-color)}
.z .y{background:var(--tg-theme-button-color);color:var(--tg-theme-button-text-color)}
.g{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.g button{color:var(--tg-theme-link-color);padding:4px 0}
.g button:disabled{opacity:.3}
.q{opacity:.5}
.e{text-align:center;padding:12px 0}
.o{font-size:13px;margin:8px 4px 0}
</style>
<div id="r"></div>
<script>
const W=window.TelegramWidget,A="%APP%",R=document.getElementById("r")
const IC='<span class="ic"><svg viewBox="0 0 24 24"><path d="M5 21v-7m0-4V3m7 18v-9m0-4V3m7 18v-5m0-4V3M2 14h6m1-6h6m1 8h6"/></svg></span>'
let s=[0,0,0,0,0,[]],v="q",pg={o:0,n:0,r:[]},sk=[],sel="",busy=0,msg="",mc=""
const e=x=>String(x??"").replace(/[&<>"]/g,c=>"&#"+c.charCodeAt(0)+";")
const H=t=>{try{t?W.HapticFeedback.notificationOccurred(t):W.HapticFeedback.impactOccurred("light")}catch(_){}}
const hm=m=>m<60?m+" мин":m<1440?Math.floor(m/60)+" ч":Math.floor(m/1440)+" дн"
const tm=m=>String(m/60|0).padStart(2,"0")+":"+String(m%60).padStart(2,"0")
const pl=(n,w)=>w[n%10==1&&n%100!=11?0:n%10>=2&&n%10<=4&&(n%100<12||n%100>14)?1:2]
function load(){try{const x=JSON.parse(W.chatData);if(x)s=x}catch(_){}
if(v=="q"&&!sk.length)pg={o:0,n:s[0],r:s[5]}}
function rows(){const p=v=="m"
return pg.r.length?pg.r.map(w=>p?`<button class="w" data-a="s" data-v="${e(w[0])}"><span class="m"><span class="t b">${e(w[1])}</span><span class="t h">${e(w[2])}${w[3]?" · скидка "+w[3]+" ₽":""}</span></span><span class="h">${sel==w[0]?"⌄":"›"}</span></button>${sel==w[0]?`<div class="z"><button class="y" data-a="y" data-v="p">Оплатил</button><button data-a="y" data-v="u">Не оплатил</button><button data-a="y" data-v="n">Не клиент</button></div>`:""}`:`<button class="w" data-a="x" data-v="${e(w[0])}"><span class="m"><span class="t b">${e(w[1])}</span><span class="t h">${e(w[2])}</span></span><span class="br"><i class="${w[3]>=1440?"bad":""}" style="width:${Math.max(6,Math.min(100,w[3]/14.4))}%"></i></span><span class="n${w[3]>=1440?" bad":""}">${hm(w[3])}</span></button>`).join(""):`<div class="e"><div class="mid ok">✓</div><div class="h">${p?"Все оплаты отмечены":"Очередь пуста"}</div></div>`}
function draw(){const q=s[0],o=s[1],u=s[2],p=v=="m",n=p?u:q,end=pg.o+pg.r.length
R.innerHTML=`<div class="hd">${IC}<span class="lb">Пульт</span><span class="lv${o>=1440?" bad":""}">${tm(s[4])}</span></div><div class="k"><div class="tb"><button data-a="t" data-v="q"${p?"":' class="on"'}>Очередь</button><button data-a="t" data-v="m"${p?' class="on"':""}>Оплата${u?" · "+u:""}</button></div><div class="hr"><div><div class="big">${n}<small>${p?pl(n,["релиз","релиза","релизов"]):"на проверке"}</small></div><div class="h">${p?"оплата не отмечена":"+"+s[3]+" за сутки"}</div></div>${!p&&q?`<span class="pl${o>=1440?" bad":""}">ждёт ${hm(o)}</span>`:""}</div><div style="margin-top:6px">${rows()}</div>${pg.n>end||pg.o?`<div class="g"><button data-a="p"${pg.o?"":" disabled"}>‹ Назад</button><span class="h">${pg.o+1}–${end} из ${pg.n}</span><button data-a="n"${pg.n>end?"":" disabled"}>Дальше ›</button></div>`:""}</div>${p?"":`<div class="u"><div class="k"><div class="h">За сутки</div><div class="mid">${s[3]}</div><div class="h">${pl(s[3],["новый релиз","новых релиза","новых релизов"])}</div></div><button class="k" data-a="t" data-v="m"><div class="h">Оплата ›</div><div class="mid ${u?"bad":"ok"}">${u||"✓"}</div><div class="h">${u?"не отмечена":"всё отмечено"}</div></button></div>`}${msg?`<div class="o ${mc}">${e(msg)}</div>`:""}`}
function ask(q,el){if(busy)return Promise.reject();busy=1;msg="";el&&el.classList.add("q")
return W.request(q).then(r=>{const d=JSON.parse(r.result);if(!d)throw 0;return d}).catch(x=>{msg=x&&x.code=="RATE_LIMITED"?"Слишком часто — подожди пару секунд":"Не получилось, попробуй ещё раз";mc="bad";H("error");draw();throw x}).finally(()=>{busy=0})}
const page=(t,o,el,ok)=>ask("a:"+t+":"+o,el).then(p=>{ok();v=t;pg={o:p[0],n:p[1],r:p[2]};draw()},()=>{})
R.onclick=ev=>{const b=ev.target.closest("[data-a]");if(!b||b.disabled)return;const a=b.dataset.a,x=b.dataset.v;a!="y"&&H()
if(a=="t"){sel="";msg="";if(x=="q"){v=x;sk=[];load();draw()}else page(x,0,b,()=>{sk=[]})}
else if(a=="x")W.openTelegramLink(A+"?startapp=a_"+x)
else if(a=="s"){sel=sel==x?"":x;msg="";draw()}
else if(a=="y")ask("a:y:"+x+":"+sel,b).then(r=>{s[2]=r[1];pg={o:r[2],n:r[3],r:r[4]};sel="";msg=r[0];mc="ok";H("success");draw()},()=>{})
else if(a=="n")page(v,pg.o+pg.r.length,b,()=>sk.push(pg.o))
else if(a=="p")page(v,sk[sk.length-1],b,()=>sk.pop())}
W.onEvent("chatDataChanged",()=>{load();draw()})
load();draw();W.ready()
</script></template>

<script src="harness.js"></script>
<script>
/* ---------- Поддельный бот: те же форматы, что lib/widgets/state.ts и queries.ts ---------- */
const APP = "https://t.me/omf_bot/app";
document.getElementById("widget").innerHTML = document.getElementById("widget").innerHTML.replace("%APP%", APP);

const uuid = (i) => (0x5e6f7a8b + i * 104729).toString(16).slice(0, 8) + "-1111-4000-8000-0000000000" + String(i % 100).padStart(2, "0");
const short = (s, n) => ([...s].length > n ? [...s].slice(0, n - 1).join("") + "…" : s);
const QUEUE = [
  ["Ночной город", "Север", 1580], ["Пыль", "Мира Ли", 640], ["Огни", "TRVL", 95], ["Не спать", "Кира", 12]
];
const PAY = [
  ["Лето без тебя", "Север", 0], ["Маяки", "Мира Ли", 500], ["Огни", "TRVL", 0]
];
const db = {};
function data(scn) {
  if (db[scn]) return db[scn];
  let q = QUEUE, p = PAY, n = 5;
  if (scn === "calm") { q = []; p = []; n = 0; }
  if (scn === "long") {
    q = Array.from({ length: 23 }, (_, i) => ["Очень длинное название релиза номер " + (i + 1) + " (Deluxe Edition)", "Константин Константинопольский", 3000 - i * 120]);
    p = Array.from({ length: 17 }, (_, i) => ["Альбом с длинным названием номер " + (i + 1) + " — расширенный", "Исполнитель с очень длинным именем", i % 3 ? 0 : 500]);
    n = 31;
  }
  return (db[scn] = { q: q.map((r, i) => [uuid(i), ...r]), p: p.map((r, i) => [uuid(100 + i), ...r]), n });
}
const PAGE = 4;
function rows(list, off, head) {
  const rs = list.slice(off, off + PAGE).map((r) => [r[0], short(r[1], 32), short(r[2], 24), r[3]]);
  return rs.slice(0, fitRows((x) => JSON.stringify(head(x)), rs));
}
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
function state(d) {
  const head = (rs) => [d.q.length, d.q.length ? Math.max(...d.q.map((r) => r[3])) : 0, d.p.length, d.n, nowMin(), rs];
  return JSON.stringify(head(rows(d.q, 0, head)));
}
const DONE = { p: "Отмечено: оплатил", u: "Отмечено: не оплатил", n: "Отмечено: не мой клиент" };

const MOCK = {
  title: "Пульт дня — карточка админа",
  prefix: "a",
  scenarios: { normal: "Обычный день", calm: "Всё разобрано", long: "Завал, длинные имена" },
  chatData: (scn) => state(data(scn)),
  nextChatData(scn) {
    const d = data(scn);
    d.q.push([uuid(99), "Новый трек", "Новый артист", 1]);
    d.n += 1;
    return state(d);
  },
  caption(scn) {
    const d = data(scn);
    if (!d.q.length && !d.p.length) return "Пульт: очередь пуста, оплаты отмечены.";
    return `Пульт: на проверке ${d.q.length}` + (d.q.length ? `, дольше всех «${short(d.q[0][1], 30)}»` : "") + (d.p.length ? `; оплата не отмечена — ${d.p.length}` : "");
  },
  answer(data_, scn) {
    const d = data(scn);
    let m = /^a:([qm]):(\d+)$/.exec(data_);
    if (m) {
      const list = m[1] === "q" ? d.q : d.p;
      const off = Math.min(Number(m[2]), list.length);
      const head = (rs) => [off, list.length, rs];
      return JSON.stringify(head(rows(list, off, head)));
    }
    m = /^a:y:([pun]):([0-9a-f-]{36})$/.exec(data_);
    if (m) {
      const i = d.p.findIndex((r) => r[0] === m[2]);
      if (i < 0) return "0";
      d.p.splice(i, 1);
      const head = (rs) => [DONE[m[1]], d.p.length, 0, d.p.length, rs];
      return JSON.stringify(head(rows(d.p, 0, head)));
    }
    return "0";
  }
};
</script>
</body>
</html>
